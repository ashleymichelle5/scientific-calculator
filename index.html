<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator">
        <div class="display">0</div>

       <div class="buttons">
        <!-- Scientific functions -->
        <button class="btn-scientific" onclick="handleClick('Math.sin(')">sin</button>
        <button class="btn-scientific" onclick="handleClick('Math.cos(')">cos</button>
        <button class="btn-scientific" onclick="handleClick('Math.tan(')">tan</button>
        <button class="btn-scientific" onclick="handleClick('Math.sqrt(')">√</button>
        <button class="btn-scientific" onclick="handleClick('**2')">x²</button>
        <button class="btn-scientific" onclick="handleClick('Math.log10(')">log</button>
        <button class="btn-scientific" onclick="handleClick('(')">(</button>
        <button class="btn-scientific" onclick="handleClick(')')">)</button>

        <!-- Clear and operators -->
        <button class="btn-clear" onclick="handleClick('C')">C</button>
        <button class="btn-clear" onclick="handleClick('backspace')">⌫</button>
        <button class="btn-operator" onclick="handleClick('±')">±</button>
        <button class="btn-operator" onclick="handleClick('%')">%</button>
        <button class="btn-operator" onclick="handleClick('÷')">÷</button>

        <!-- Numbers -->
        <button class="btn-number" onclick="handleClick('7')">7</button>
        <button class="btn-number" onclick="handleClick('8')">8</button>
        <button class="btn-number" onclick="handleClick('9')">9</button>
        <button class="btn-operator" onclick="handleClick('×')">×</button>

        <button class="btn-number"  onclick="handleClick('4')">4</button>
        <button class="btn-number" onclick="handleClick('5')">5</button>
        <button class="btn-number" onclick="handleClick('6')">6</button>
        <button class="btn-operator" onclick="handleClick('-')">-</button>

        <button class="btn-number" onclick="handleClick('1')">1</button>
        <button class="btn-number" onclick="handleClick('2')">2</button>
        <button class="btn-number" onclick="handleClick('3')">3</button>
        <button class="btn-operator" onclick="handleClick('+')">+</button>

        <button class="btn-number" onclick="handleClick('0')">0</button>
        <button class="btn-number" onclick="handleClick('.')">.</button>
        <button class="btn-equals" onclick="handleClick('=')">=</button>
      </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
